<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>忆伴 - 首页 预览（v2 修复后）</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { background:#1a1a2e; display:flex; justify-content:center; align-items:flex-start; min-height:100vh; padding:20px 0; }

  .phone { width:375px; height:812px; background:#000; border-radius:44px; padding:12px; box-shadow:0 20px 60px rgba(0,0,0,0.5); position:relative; }
  .phone-notch { position:absolute; top:12px; left:50%; transform:translateX(-50%); width:150px; height:28px; background:#000; border-radius:0 0 18px 18px; z-index:10; }
  .screen-wrap { width:375px; height:806px; overflow:hidden; border-radius:32px; }
  .screen { width:750px; height:1623px; transform:scale(0.5); transform-origin:top left; border-radius:32px; overflow:hidden; background:#F5F9F6; position:relative; }

  /* ========= 页面 ========= */
  .page { background:#F5F9F6; display:flex; flex-direction:column; width:750px; min-height:1623px; padding-bottom:220px; }
  .statusbar { height:88px; width:750px; display:flex; align-items:center; justify-content:space-between; padding:0 40px; font-family:-apple-system,sans-serif; font-size:32px; font-weight:600; color:#192620; }

  /* ========= 顶部 ========= */
  .group-1 { position:relative; width:750px; display:flex; flex-direction:column; padding-top:88px; }

  .date-pill { display:flex; align-items:center; background:#E5F2EB; border-radius:15px; width:344px; height:60px; margin:22px 0 0 52px; }
  .date-pill__icon { width:25px; height:29px; margin:10px 14px 0 23px; }
  .date-pill__text { font-family:-apple-system,"PingFang SC",sans-serif; font-size:29px; font-weight:700; color:#365947; white-space:nowrap; line-height:43px; }

  .greeting { font-family:-apple-system,"PingFang SC",sans-serif; font-size:54px; font-weight:500; color:#192620; white-space:nowrap; line-height:67px; margin:-2px 0 20px 52px; }

  /* 头像修复：bottom 与问候语 bottom 齐平
     胶囊 top=88+42=130, 胶囊 bottom=190, 问候语 top=188, 问候语 bottom=255
     头像 bottom=255, 头像高=123, top=255-123=132  */
  .head-avatar { position:absolute; left:560px; top:112px; width:123px; height:123px; border-radius:9999px; background:#fff; box-shadow:0 4px 6px -1px rgba(0,0,0,0.1); overflow:hidden; }
  .head-avatar img { width:123px; height:123px; border-radius:9999px; object-fit:cover; }

  /* ========= 看看从前 ========= */
  .lookback { background:#fff; border-radius:46px; width:688px; height:488px; margin:-2px 0 0 31px; box-shadow:0 4px 16px rgba(30,50,40,0.06); border:1px solid #E3EDE7; display:flex; flex-direction:column; }
  .lookback__head { display:flex; align-items:center; justify-content:flex-start; width:608px; height:63px; margin:33px 0 0 40px; }
  .lookback__head-icon { width:46px; height:46px; margin-top:10px; }
  .lookback__head-title { font-family:-apple-system,"PingFang SC",sans-serif; font-size:42px; font-weight:500; color:#192620; line-height:63px; margin-left:12px; }
  .lookback__head-tip { font-family:-apple-system,"PingFang SC",sans-serif; font-size:29px; font-weight:500; color:#4F6358; margin-top:10px; line-height:43px; margin-left:auto; }

  .entries { display:flex; justify-content:space-between; width:623px; height:337px; margin:23px 0 33px 33px; }
  .entry { width:192px; display:flex; flex-direction:column; }
  .entry--green { background:#F4F9F6; border:2px solid #D4E8DC; height:335px; }
  .entry--orange { background:#FFF6EF; border:2px solid #FDCCC5; margin-left:23px; height:337px; }
  .entry--blue { background:#F0F5FA; border:2px solid #D3E3F2; margin-left:23px; height:337px; }
  .entry__avatar { width:123px; height:123px; border-radius:9999px; background:#fff; box-shadow:0 4px 6px -1px rgba(0,0,0,0.1); display:flex; align-items:center; justify-content:center; overflow:hidden; margin:48px 0 0 35px; }
  .entry--orange .entry__avatar, .entry--blue .entry__avatar { margin-top:50px; }
  .entry__avatar img { width:123px; height:123px; border-radius:9999px; object-fit:cover; background:#fff; }
  .entry__blue-circle { width:123px; height:123px; border-radius:9999px; background:#3874AB; box-shadow:0 4px 6px -1px rgba(0,0,0,0.1); display:flex; align-items:center; justify-content:center; margin:50px 0 0 35px; }
  .entry__blue-icon { width:90px; height:83px; }
  .entry__name { font-family:-apple-system,"PingFang SC",sans-serif; font-size:38px; font-weight:500; color:#192620; text-align:center; line-height:58px; margin-top:15px; }
  .entry__sub { font-family:-apple-system,"PingFang SC",sans-serif; font-size:25px; font-weight:500; text-align:center; line-height:38px; margin-top:4px; white-space:nowrap; margin-bottom:48px; }
  .entry--orange .entry__sub, .entry--blue .entry__sub { margin-top:2px; margin-bottom:50px; }
  .entry__sub--green { color:#365947; }
  .entry__sub--orange { color:#BA5518; }
  .entry__sub--blue { color:#275988; }

  /* ========= 下方双栏 ========= */
  .duo { width:688px; height:579px; margin:15px 0 0 31px; display:flex; justify-content:space-between; }

  .brain { width:360px; height:579px; background:#57B5A5; border-radius:46px; border:2px solid rgba(54,89,71,0.2); box-shadow:0 8px 24px rgba(54,89,71,0.28); display:flex; flex-direction:column; }
  .brain__top { display:flex; align-items:center; justify-content:space-between; width:317px; margin:46px 0 0 27px; }
  .brain__title { font-family:-apple-system,"PingFang SC",sans-serif; font-size:50px; font-weight:500; letter-spacing:-1px; color:#fff; line-height:63px; }
  .brain__mini { width:77px; height:77px; border-radius:9999px; background:rgba(255,255,255,0.15); display:flex; align-items:center; justify-content:center; margin-left:-6px; }
  .ic-play { width:19px; height:31px; background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23ffffff'><path d='M8 5v14l11-7z'/></svg>"); background-repeat:no-repeat; background-size:contain; }
  .brain__desc { font-family:-apple-system,"PingFang SC",sans-serif; font-size:33px; font-weight:500; color:#CFE4D8; line-height:49px; margin:62px 0 0 27px; white-space:pre-line; }
  .brain__play { width:138px; height:138px; border-radius:9999px; background:#fff; box-shadow:0 10px 15px -3px rgba(0,0,0,0.1); display:flex; align-items:center; justify-content:center; margin:62px 0 63px 27px; }
  .brain__play img { width:92px; height:92px; }

  .duo__right { width:298px; height:579px; display:flex; flex-direction:column; justify-content:space-between; }

  .call { width:298px; height:265px; background:#FF7A29; border-radius:46px; border:2px solid rgba(255,255,255,0.4); box-shadow:0 8px 24px rgba(255,122,41,0.38); display:flex; flex-direction:column; }
  .call__top { display:flex; align-items:flex-start; justify-content:space-between; width:250px; height:123px; margin:27px 0 0 31px; }
  .call__avatar { width:123px; height:123px; border-radius:9999px; background:rgba(255,255,255,0.25); display:flex; align-items:center; justify-content:center; overflow:hidden; }
  .call__avatar img { width:108px; height:108px; border-radius:9999px; object-fit:cover; margin:8px 0 0 8px; }
  .call__mini { width:92px; height:92px; border-radius:9999px; background:rgba(255,255,255,0.25); display:flex; align-items:center; justify-content:center; }
  .ic-phone { width:44px; height:44px; background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23ffffff'><path d='M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.6 21 3 13.4 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.2.2 2.4.6 3.6.1.4 0 .8-.2 1l-2.3 2.2z'/></svg>"); background-repeat:no-repeat; background-size:contain; }
  .ic-phone--sm { width:19px; height:33px; }
  .call__label { display:flex; align-items:flex-start; width:252px; height:75px; margin:17px 0 23px 37px; }
  .call__title { font-family:-apple-system,"PingFang SC",sans-serif; font-size:50px; font-weight:500; letter-spacing:-1px; color:#fff; margin-left:12px; line-height:75px; }

  .remind { width:298px; height:287px; background:#fff; border-radius:46px; border:1px solid #E3EDE7; box-shadow:0 4px 16px rgba(30,50,40,0.06); display:flex; flex-direction:column; }
  .remind__head { display:flex; align-items:flex-start; width:225px; height:63px; margin:33px 0 0 40px; }
  .ic-bell { width:40px; height:40px; background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23192620'><path d='M12 2a2 2 0 0 0-2 2v.5C7.5 5.4 6 7.6 6 10v4l-2 2v1h16v-1l-2-2v-4c0-2.4-1.5-4.6-4-4.5V4a2 2 0 0 0-2-2zm0 20a3 3 0 0 0 3-3H9a3 3 0 0 0 3 3z'/></svg>"); background-repeat:no-repeat; background-size:contain; }
  .remind__title { font-family:-apple-system,"PingFang SC",sans-serif; font-size:42px; font-weight:500; color:#192620; line-height:63px; margin-left:12px; }

  .med { margin:8px 0 17px 23px; background:#FEF6EE; border-radius:31px; border:2px solid #FBD6B6; width:263px; height:165px; display:flex; align-items:flex-start; }
  .med__circle { width:92px; height:92px; border-radius:9999px; background:#E97A37; box-shadow:0 1px 2px rgba(0,0,0,0.05); display:flex; align-items:center; justify-content:center; flex-shrink:0; margin:37px 0 0 23px; }
  .med__circle img { width:40px; height:46px; }
  .med__text { display:flex; flex-direction:column; margin:30px 0 0 12px; }
  .med__name { font-family:-apple-system,"PingFang SC",sans-serif; font-size:42px; font-weight:500; color:#192620; line-height:58px; }
  .med__time { font-family:-apple-system,"PingFang SC",sans-serif; font-size:25px; font-weight:500; color:#A25016; line-height:38px; }

  /* ========= TabBar v2: icon 上文字下 ========= */
  .tabbar { position:absolute; bottom:0; left:0; width:750px; height:169px; background:rgba(242,252,245,0.95); box-shadow:0 -8px 24px -4px rgba(44,53,49,0.06); }
  .tab-home { position:absolute; left:67px; top:25px; width:171px; height:106px; border-radius:19229px; background:#486556; box-shadow:0 4px 12px rgba(72,101,86,0.25); display:flex; flex-direction:column; align-items:center; justify-content:space-between; padding:12px 0; }
  .tab-home img { width:37px; height:44px; filter:brightness(0) invert(1); }
  .tab-home span { font-family:-apple-system,"PingFang SC",sans-serif; font-size:29px; font-weight:500; color:#fff; letter-spacing:1px; line-height:38px; }

  .tab-memoir { position:absolute; left:315px; top:35px; display:flex; flex-direction:column; align-items:center; width:130px; }
  .tab-memoir img { width:80px; height:80px; padding:18px; border-radius:9999px; background:rgba(233,122,55,0.14); object-fit:contain; }
  .tab-memoir span { font-family:-apple-system,"PingFang SC",sans-serif; font-size:29px; font-weight:500; color:#E97A37; letter-spacing:1px; line-height:38px; margin-top:6px; }

  .tab-mine { position:absolute; left:566px; top:38px; display:flex; flex-direction:column; align-items:center; width:80px; }
  .tab-mine img { width:72px; height:72px; padding:16px; border-radius:9999px; background:rgba(233,122,55,0.14); object-fit:contain; }
  .tab-mine span { font-family:-apple-system,"PingFang SC",sans-serif; font-size:29px; font-weight:500; color:#E97A37; letter-spacing:1px; line-height:38px; margin-top:8px; }

  .hint { position:fixed; top:10px; left:50%; transform:translateX(-50%); background:rgba(0,0,0,0.7); color:#fff; padding:8px 16px; border-radius:20px; font-size:13px; z-index:9999; font-family:sans-serif; }
</style>
</head>
